<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f2f2ef">
  <title>Door & Key — Accenture Game Practice</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Arial, Helvetica, sans-serif;
      color: #27272a;
      background: #f2f2ef;
      --dark: #080b0e;
      --header: #11171c;
      --button: #29323a;
      --grid-line: #cdd1cf;
      --cell-size: min(20vw, 88px);
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      background: #f2f2ef;
    }

    .assessment-header {
      min-height: 92px;
      background: var(--dark);
      color: #fff;
    }

    .header-notice {
      display: none;
    }

    .brand-row {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 14px;
      width: min(100%, 1120px);
      min-height: 92px;
      margin: 0 auto;
      padding: 24px;
    }

    .brand {
      position: relative;
      color: #f7f7f7;
      font-size: clamp(24px, 5vw, 32px);
      font-weight: 700;
      letter-spacing: -1.8px;
      line-height: 1;
    }

    .brand-mark {
      position: absolute;
      top: -13px;
      right: 22px;
      color: #a100ff;
      font-size: 24px;
      font-weight: 800;
      line-height: 1;
      transform: rotate(-18deg);
    }

    .site-navigation {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px;
      width: 100%;
    }

    .site-navigation a {
      padding: 7px 10px;
      border: 1px solid rgb(255 255 255 / 22%);
      border-radius: 3px;
      color: #e5e7eb;
      font-size: 12px;
      font-weight: 600;
      text-decoration: none;
      white-space: nowrap;
    }

    .site-navigation a:hover,
    .site-navigation a[aria-current="page"] {
      border-color: #87939a;
      background: #26313a;
      color: #fff;
    }

    main {
      width: min(100%, 540px);
      margin: 0 auto;
      padding: 20px 14px 28px;
    }

    .game-card {
      width: fit-content;
      max-width: 100%;
      margin: 0 auto;
      padding: 5px;
      background: #dfe3e1;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(var(--grid-size), var(--cell-size));
      grid-template-rows: repeat(var(--grid-size), var(--cell-size));
      overflow: hidden;
      border: 3px solid var(--grid-line);
      background: var(--grid-line);
      gap: 3px;
    }

    .cell {
      display: grid;
      position: relative;
      min-width: 0;
      min-height: 0;
      place-items: center;
      padding: 0;
      border: 0;
      background: #e9ebea;
      color: #354b54;
      font: inherit;
      font-size: clamp(20px, 4vw, 32px);
    }

    .cell.floor { cursor: pointer; }
    .cell.floor:hover { background: #f1f2f1; }
    .cell.wall { background: #777; cursor: not-allowed; }
    .cell.visited { background: #c9cecb; }
    .cell.player {
      z-index: 1;
      margin: 5%;
      border-radius: 4px;
      background: #45585f;
    }
    .cell.player:hover { background: #45585f; }
    .cell.visited:hover { background: #c9cecb; }
    .cell.key:hover,
    .cell.door:hover { background: #e9ebea; }
    .cell.player::after {
      position: absolute;
      right: calc(0px - var(--marker-arrow));
      bottom: 25%;
      width: 0;
      height: 0;
      border-top: var(--marker-arrow) solid transparent;
      border-bottom: var(--marker-arrow) solid transparent;
      border-left: calc(var(--marker-arrow) * 1.3) solid #45585f;
      content: "";
    }
    .cell svg { width: min(76%, 42px); height: min(76%, 42px); }
    .cell.player svg { width: 82%; height: 82%; }
    .cell.hit-up::before,
    .cell.hit-right::before,
    .cell.hit-down::before,
    .cell.hit-left::before {
      position: absolute;
      z-index: 3;
      background: #e11d48;
      animation: wall-flash 650ms ease-out;
    }
    .cell.hit-up::before,
    .cell.hit-right::before,
    .cell.hit-down::before,
    .cell.hit-left::before { content: ""; }
    .cell.door-locked-hit {
      outline: 4px solid #e11d48;
      outline-offset: -5px;
      animation: door-flash 650ms ease-out;
    }
    .cell.hit-up::before,
    .cell.hit-down::before { right: 0; left: 0; height: 5px; }
    .cell.hit-right::before,
    .cell.hit-left::before { top: 0; bottom: 0; width: 5px; }
    .cell.hit-up::before { top: -3px; }
    .cell.hit-right::before { right: -3px; }
    .cell.hit-down::before { bottom: -3px; }
    .cell.hit-left::before { left: -3px; }
    @keyframes wall-flash {
      0%, 35% { background: #e11d48; box-shadow: 0 0 12px 4px rgb(225 29 72 / 50%); }
      100% { background: #e11d48; box-shadow: none; }
    }
    @keyframes door-flash {
      0%, 35% { box-shadow: inset 0 0 0 4px #e11d48, 0 0 12px 4px rgb(225 29 72 / 50%); }
      100% { box-shadow: inset 0 0 0 4px #e11d48; }
    }
    .cell:focus-visible { outline: 3px solid #2563eb; outline-offset: -4px; }

    .under-board {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      width: min(100%, 360px);
      margin: 12px auto 0;
    }

    .timer {
      display: grid;
      flex: 0 0 48px;
      width: 48px;
      height: 48px;
      place-items: center;
      border: 5px solid #6b7775;
      border-radius: 50%;
      color: #414c4a;
      font-size: 13px;
      font-variant-numeric: tabular-nums;
    }

    .instruction {
      flex: 1;
      color: #59615f;
      font-size: 12px;
      line-height: 1.55;
      text-align: center;
    }

    .instruction strong {
      color: #454d4b;
      font-weight: 500;
    }
    .instruction.key-found {
      color: #405860;
      font-weight: 600;
    }

    .level-picker {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 5px;
      width: min(100%, 360px);
      margin: 22px auto 0;
      padding-top: 14px;
      border-top: 1px solid #d2d7d4;
    }

    .level-button {
      display: grid;
      flex: 0 0 19px;
      width: 19px;
      height: 19px;
      padding: 0;
      border: 1px solid #8c9693;
      border-radius: 50%;
      background: transparent;
      color: #59615f;
      font: inherit;
      font-size: 10px;
      line-height: 1;
      cursor: pointer;
    }
    .level-button[aria-current="step"] { border-color: #40524f; background: #40524f; color: #fff; }
    .level-button.completed { border-color: #65716e; background: #aab2af; color: #27313a; }
    .level-button:focus-visible { outline: 2px solid #2563eb; outline-offset: 3px; }

    .status {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
    }

    @media (max-width: 620px) {
      :root { --cell-size: min(20vw, 82px); }
      .assessment-header { min-height: 76px; }
      .brand-row { min-height: 76px; padding: 12px; gap: 8px; }
      .site-navigation { gap: 5px; }
      .site-navigation a { padding: 6px 7px; font-size: 10px; }
      main { padding: 22px 8px 28px; }
      .game-card { padding: 4px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <header class="assessment-header">
    <div class="brand-row">
      <div class="brand" aria-label="Accenture">accenture<span class="brand-mark" aria-hidden="true">&gt;</span></div>
      <nav class="site-navigation" aria-label="Game navigation">
        <a href="game.html">Arrow Games</a>
        <a href="bubble.html">Bubble Game</a>
        <a href="door-key.html" aria-current="page">Door-Key Game</a>
        <a href="mock-test.html">MCQ</a>
        <a href="code.html">Code</a>
      </nav>
    </div>
  </header>
  <main>
    <section class="game-card" aria-label="Door and key puzzle">
      <div class="board" id="board" role="grid" aria-label="Puzzle board"></div>
    </section>
    <div class="under-board">
      <div class="timer" id="timerStatus" aria-label="Time remaining">4:00</div>
      <div class="instruction" id="instruction">Collect 1 <strong>KEY</strong><br>then get to the <strong>DOOR</strong></div>
    </div>
    <div class="level-picker" id="levelPicker" aria-label="Choose level"></div>
    <p class="status" id="status" role="status" aria-live="polite"></p>
  </main>
  <script>
    (() => {
      "use strict";

      const LEVEL_TEMPLATES = [
        { name: "Level 1", start: [0,0], key: [1,1], door: [3,3], walls: ["0,2,D","1,2,R","1,3,D"] },
        { name: "Level 2", start: [0,3], key: [2,1], door: [3,0], walls: ["3,2,R","2,0,D","2,2,D"] },
        { name: "Level 3", start: [3,0], key: [0,2], door: [0,3], walls: ["3,2,R","3,0,R","1,0,R","1,1,R"] },
        { name: "Level 4", start: [2,0], key: [1,3], door: [3,3], walls: ["2,3,D","2,0,R","0,1,D","1,0,D"] },
        { name: "Level 5", start: [3,3], key: [1,2], door: [0,0], walls: ["1,2,D","2,2,D","2,1,D","3,1,R","3,0,R"] },
        { name: "Level 6", start: [0,1], key: [3,1], door: [2,3], walls: ["0,3,D","0,0,D","2,3,D","0,0,R","2,2,R"] },
        { name: "Level 7", start: [1,0], key: [3,3], door: [0,2], walls: ["1,1,D","0,0,R","1,2,R","3,0,R","0,0,D","0,1,R"] },
        { name: "Level 8", start: [2,3], key: [0,0], door: [3,0], walls: ["1,2,R","3,1,R","2,2,D","1,2,D","3,2,R","2,2,R"] },
        { name: "Level 9", start: [3,2], key: [1,1], door: [0,3], walls: ["1,0,R","0,1,R","1,0,D","1,3,D","1,1,D","0,2,R","2,0,D"] },
        { name: "Level 10", start: [0,2], key: [3,3], door: [1,0], walls: ["0,1,R","1,0,D","0,1,D","0,0,R","2,1,D","2,2,R","2,3,D"] },
        { name: "Level 11", start: [0,0], key: [2,2], door: [3,1], walls: ["1,3,D","2,2,D","0,0,D","2,0,D","2,2,R","0,1,D","1,0,R","2,3,D"] },
        { name: "Level 12", start: [3,1], key: [0,2], door: [2,3], walls: ["2,2,D","1,3,D","2,1,R","1,1,R","1,2,D","1,0,R","2,0,R","2,2,R"] },
        { name: "Level 13", start: [1,3], key: [2,0], door: [3,2], walls: ["2,2,R","1,0,D","1,2,D","0,3,D","0,0,R","2,1,R","2,2,D","2,3,D","0,1,D"] },
        { name: "Level 14", start: [2,2], key: [0,1], door: [0,3], walls: ["3,1,R","0,2,R","3,2,R","1,2,D","3,0,R","1,2,R","2,1,D","2,2,D","0,1,R"] },
        { name: "Level 15", start: [0,3], key: [2,2], door: [3,0], walls: ["0,3,D","2,2,R","1,0,R","0,1,R","2,1,R","0,1,D","3,2,R","0,0,D","1,2,D","1,0,D"] }
      ];
      function scalePosition(position, size) {
        return position.map(value => Math.round(value * (size - 1) / 3));
      }

      function createLevels() {
        return LEVEL_TEMPLATES.map((template, index) => {
          const size = index + 4;
          const walls = new Set();
          for (const edge of template.walls) {
            const [row, col, direction] = edge.split(",");
            const [scaledRow, scaledCol] = scalePosition([Number(row), Number(col)], size);
            if (direction === "R") {
              const nextCol = scalePosition([Number(col) + 1], size)[0];
              for (let wallCol = scaledCol; wallCol < nextCol; wallCol++) {
                walls.add(`${scaledRow},${wallCol},R`);
              }
            } else {
              const nextRow = scalePosition([Number(row) + 1], size)[0];
              for (let wallRow = scaledRow; wallRow < nextRow; wallRow++) {
                walls.add(`${wallRow},${scaledCol},D`);
              }
            }
          }
          return {
            name: template.name,
            size,
            start: scalePosition(template.start, size),
            key: scalePosition(template.key, size),
            door: scalePosition(template.door, size),
            walls: [...walls]
          };
        });
      }

      const LEVELS = createLevels();
      const DIRECTIONS = {
        up: [-1, 0],
        right: [0, 1],
        down: [1, 0],
        left: [0, -1]
      };
      const TIME_LIMIT = 240;
      const ICONS = {
        player: '<svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="19" r="11" fill="#f2f2ef"/><path d="M13 54c0-13 8-21 19-21s19 8 19 21v3H13z" fill="#f2f2ef"/></svg>',
        playerWithKey: '<svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="29" cy="19" r="11" fill="#f2f2ef"/><path d="M10 54c0-13 8-21 19-21s19 8 19 21v3H10z" fill="#f2f2ef"/><path d="M51 34a6 6 0 0 0-5 9l-6 6v5h5v-4h4v-4l4-4a6 6 0 1 0-2-8Zm2 5a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3Z" fill="#f2f2ef"/></svg>',
        key: '<svg viewBox="0 0 64 64" aria-hidden="true"><path d="M40 8a17 17 0 0 0-15.2 24.6L8 49.4V59h10v-7h8v-7h7.4l4.4-4.4A17 17 0 1 0 40 8Zm5.5 15a4 4 0 1 1 0-8 4 4 0 0 1 0 8Z" fill="#405860"/></svg>',
        door: '<svg viewBox="0 0 64 64" aria-hidden="true"><path d="M13 58V12a5 5 0 0 1 4.4-5l27-3A5 5 0 0 1 50 9v49" fill="none" stroke="#405860" stroke-width="4" stroke-linejoin="round"/><path d="M9 58h49" fill="none" stroke="#405860" stroke-width="4" stroke-linecap="round"/><circle cx="41" cy="34" r="2.8" fill="#405860"/></svg>',
        openDoor: '<svg viewBox="0 0 64 64" aria-hidden="true"><path d="M13 58V12a5 5 0 0 1 4.4-5l27-3A5 5 0 0 1 50 9v49M9 58h49" fill="none" stroke="#405860" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><path d="m50 11 9 4v40l-9 3" fill="none" stroke="#405860" stroke-width="4" stroke-linejoin="round"/><circle cx="55" cy="35" r="2" fill="#405860"/></svg>'
      };
      const board = document.getElementById("board");
      const status = document.getElementById("status");
      const timerStatus = document.getElementById("timerStatus");
      const levelPicker = document.getElementById("levelPicker");
      const instruction = document.getElementById("instruction");
      let levelIndex = 0;
      let player = [...LEVELS[0].start];
      let hasKey = false;
      let moves = 0;
      let secondsLeft = TIME_LIMIT;
      let levelComplete = false;
      let timerId = null;
      let wallFlashTimer = null;
      let wallFlash = null;
      let lockedDoorFlash = null;
      let visited = new Set([LEVELS[0].start.join(",")]);
      const completedLevels = new Set();

      function formatTime(seconds) {
        return `${Math.floor(seconds / 60)}:${String(seconds % 60).padStart(2, "0")}`;
      }

      function setStatus(message, type = "") {
        status.className = `status${type ? ` ${type}` : ""}`;
        status.textContent = message;
      }

      function renderLevelPicker() {
        levelPicker.replaceChildren(...LEVELS.map((level, index) => {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "level-button";
          button.textContent = String(index + 1);
          button.setAttribute("aria-label", `Level ${index + 1}: ${level.name}`);
          button.title = `Level ${index + 1}: ${level.name}`;
          if (completedLevels.has(index)) button.classList.add("completed");
          if (index === levelIndex) {
            button.setAttribute("aria-current", "step");
            button.setAttribute("aria-label", `Level ${index + 1}: ${level.name} (current). Select to restart.`);
          }
          button.addEventListener("click", () => loadLevel(index));
          return button;
        }));
      }

      function renderBoard() {
        const level = LEVELS[levelIndex];
        const size = level.size;
        board.style.setProperty("--grid-size", size);
        const maxBoardWidth = Math.min(window.innerWidth - 32, 500);
        const cellSize = Math.min(88, Math.floor((maxBoardWidth - 14 - (size - 1) * 3) / size));
        board.style.setProperty("--cell-size", `${cellSize}px`);
        board.style.setProperty("--marker-arrow", `${Math.max(3, Math.min(12, Math.round(cellSize * 0.14)))}px`);
        board.setAttribute("aria-label", `Level ${levelIndex + 1} board, ${size} by ${size}`);
        const cells = [];

        for (let row = 0; row < size; row++) {
          for (let col = 0; col < size; col++) {
            const button = document.createElement("button");
            const isDoor = row === level.door[0] && col === level.door[1];
            const isPlayer = row === player[0] && col === player[1] && !(levelComplete && isDoor);
            const isKey = row === level.key[0] && col === level.key[1] && !hasKey;
            const isVisited = visited.has(`${row},${col}`);
            button.type = "button";
            button.className = `cell floor${isVisited && !isPlayer ? " visited" : ""}`;
            if (isPlayer) button.classList.add("player");
            if (isKey) button.classList.add("key");
            if (isDoor) button.classList.add("door");
            if (isDoor && hasKey) button.classList.add("open");
            if (wallFlash && wallFlash.row === row && wallFlash.col === col) {
              button.classList.add(`hit-${wallFlash.direction}`);
            }
            if (lockedDoorFlash && lockedDoorFlash.row === row && lockedDoorFlash.col === col) {
              button.classList.add("door-locked-hit");
            }
            button.setAttribute("role", "gridcell");
            button.setAttribute("aria-label", levelComplete && isDoor ? "Door reached" :
              isPlayer ? "You are here" :
              isKey ? "Key" :
              isDoor ? (hasKey ? "Unlocked door" : "Locked door") : "Empty space");
            button.innerHTML = levelComplete && isDoor ? ICONS.openDoor :
              isPlayer ? (hasKey ? ICONS.playerWithKey : ICONS.player) :
              isKey ? ICONS.key : isDoor ? (hasKey ? ICONS.openDoor : ICONS.door) : "";
            button.addEventListener("click", () => moveToCell(row, col));
            cells.push(button);
          }
        }

        board.replaceChildren(...cells);
      }

      function loadLevel(index) {
        if (index < 0 || index >= LEVELS.length) return;
        window.clearInterval(timerId);
        window.clearTimeout(wallFlashTimer);
        wallFlash = null;
        lockedDoorFlash = null;
        levelIndex = index;
        player = [...LEVELS[index].start];
        hasKey = false;
        moves = 0;
        secondsLeft = TIME_LIMIT;
        levelComplete = false;
        visited = new Set([player.join(",")]);
        setStatus("Collect the key to unlock the door.");
        setInstruction(false);
        renderLevelPicker();
        renderBoard();
        updateTimer();
        timerId = window.setInterval(() => {
          if (secondsLeft > 0) {
            secondsLeft -= 1;
            updateTimer();
          } else {
            window.clearInterval(timerId);
            timerId = null;
            levelComplete = true;
            setStatus("Time is up. Reset the level to try again.", "error");
            renderBoard();
          }
        }, 1000);
      }

      function updateTimer() {
        timerStatus.textContent = formatTime(secondsLeft);
        timerStatus.setAttribute("aria-label", `${formatTime(secondsLeft)} remaining`);
      }

      function setInstruction(keyFound, complete = false) {
        instruction.classList.toggle("key-found", keyFound || complete);
        instruction.innerHTML = complete
          ? "DOOR reached!<br>Level complete"
          : keyFound
            ? "KEY collected!<br>Now reach the <strong>DOOR</strong>"
            : "Collect 1 <strong>KEY</strong><br>then get to the <strong>DOOR</strong>";
      }

      function isHiddenWall(row, col, direction) {
        const [rowDelta, colDelta] = DIRECTIONS[direction];
        const nextRow = row + rowDelta;
        const nextCol = col + colDelta;
        const size = LEVELS[levelIndex].size;
        if (nextRow < 0 || nextCol < 0 || nextRow >= size || nextCol >= size) return true;
        const edge = direction === "right" || direction === "down"
          ? `${row},${col},${direction === "right" ? "R" : "D"}`
          : direction === "left"
            ? `${nextRow},${nextCol},R`
            : `${nextRow},${nextCol},D`;
        return LEVELS[levelIndex].walls.includes(edge);
      }

      function hitHiddenWall(direction) {
        const [row, col] = player;
        lockedDoorFlash = null;
        wallFlash = { row, col, direction };
        window.clearTimeout(wallFlashTimer);
        player = [...LEVELS[levelIndex].start];
        hasKey = false;
        moves = 0;
        visited = new Set([player.join(",")]);
        setInstruction(false);
        setStatus("Invisible wall! Back to the start — try another route.", "error");
        renderBoard();
        wallFlashTimer = window.setTimeout(() => {
          wallFlash = null;
          renderBoard();
        }, 700);
      }

      function hitLockedDoor(row, col, direction) {
        const opposite = { up: "down", right: "left", down: "up", left: "right" };
        lockedDoorFlash = { row, col };
        wallFlash = { row, col, direction: opposite[direction] };
        window.clearTimeout(wallFlashTimer);
        setStatus("Door locked! Collect the key first.", "error");
        renderBoard();
        wallFlashTimer = window.setTimeout(() => {
          wallFlash = null;
          lockedDoorFlash = null;
          renderBoard();
        }, 700);
      }

      function moveToCell(row, col) {
        if (levelComplete) return;
        const rowDistance = Math.abs(row - player[0]);
        const colDistance = Math.abs(col - player[1]);
        if (rowDistance + colDistance !== 1) {
          setStatus("Move one square at a time.", "error");
          return;
        }
        move(
          row < player[0] ? "up" :
          row > player[0] ? "down" :
          col < player[1] ? "left" : "right"
        );
      }

      function move(direction) {
        if (levelComplete) return;
        const [rowDelta, colDelta] = DIRECTIONS[direction];
        const row = player[0] + rowDelta;
        const col = player[1] + colDelta;
        const level = LEVELS[levelIndex];
        if (isHiddenWall(player[0], player[1], direction)) {
          hitHiddenWall(direction);
          return;
        }
        if (row === level.door[0] && col === level.door[1] && !hasKey) {
          hitLockedDoor(row, col, direction);
          return;
        }
        player = [row, col];
        visited.add(`${row},${col}`);
        moves += 1;
        if (!hasKey && row === level.key[0] && col === level.key[1]) {
          hasKey = true;
          setInstruction(true);
          setStatus("Key collected! Now find the door.", "success");
        } else if (row === level.door[0] && col === level.door[1]) {
          if (hasKey) {
            levelComplete = true;
            completedLevels.add(levelIndex);
            window.clearInterval(timerId);
            timerId = null;
            setInstruction(true, true);
            renderLevelPicker();
            setStatus(
              levelIndex === LEVELS.length - 1
                ? `Level complete in ${moves} moves! You finished every level.`
                : `Level ${levelIndex + 1} complete! Select the next progress dot.`,
              "success"
            );
          } else {
            setStatus("The door is locked. Find the key first.", "error");
          }
        } else {
          setStatus(hasKey ? "You have the key. Reach the door!" : "Find the key, then reach the door.");
        }
        renderBoard();
      }

      document.addEventListener("keydown", event => {
        if (event.altKey || event.ctrlKey || event.metaKey) return;
        if (event.key.toLowerCase() === "r") {
          loadLevel(levelIndex);
          return;
        }
        const direction = {
          ArrowUp: "up", ArrowRight: "right", ArrowDown: "down", ArrowLeft: "left",
          w: "up", d: "right", s: "down", a: "left"
        }[event.key];
        if (!direction) return;
        event.preventDefault();
        move(direction);
      });

      loadLevel(0);
    })();
  </script>
</body>
</html>
