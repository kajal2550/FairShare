<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f4f5">
  <title>Accenture Path Game — Level 2</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Arial, Helvetica, sans-serif;
      color: #27272a;
      background: #f2f2ef;
      --cell-size: min(3.2vw, 32px);
      --dark-cell: #777;
      --grid-line: #cbd0d5;
      --block-line: #090909;
      --accent: #facc15;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      background: #f2f2ef;
    }

    .assessment-header {
      min-height: 204px;
      color: #fff;
      background: #080b0e;
    }

    .header-notice {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 52px;
      padding: 10px 16px;
      border-bottom: 1px solid rgb(255 255 255 / 5%);
      background: #11171c;
      color: #e5e7eb;
      font-size: 12px;
      text-align: center;
    }

    .brand-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 14px;
      width: min(100%, 1120px);
      min-height: 150px;
      margin: 0 auto;
      padding: 24px;
    }

    .site-navigation {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .site-navigation a {
      padding: 8px 12px;
      border: 1px solid rgb(255 255 255 / 18%);
      border-radius: 8px;
      color: #e5e7eb;
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
    }

    .site-navigation a:hover,
    .site-navigation a[aria-current="page"] {
      border-color: #a100ff;
      background: rgb(161 0 255 / 14%);
      color: #fff;
    }

    .brand {
      position: relative;
      display: inline-block;
      color: #f7f7f7;
      font-size: clamp(28px, 5vw, 38px);
      font-weight: 700;
      letter-spacing: -1.8px;
      line-height: 1;
    }

    .brand-mark {
      position: absolute;
      top: -17px;
      right: 26px;
      color: #a100ff;
      font-size: 30px;
      font-weight: 800;
      line-height: 1;
      transform: rotate(-18deg);
    }

    main {
      width: min(100%, 1080px);
      margin: 0 auto;
      padding: 18px 24px 32px;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .question-bar {
      width: min(100%, 880px);
      min-height: 34px;
      margin: 0 auto 18px;
      padding: 8px 14px;
      border-radius: 2px;
      background: #26313a;
      color: #f4f4f5;
      font-size: 12px;
      font-weight: 600;
    }

    .level-navigation {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin: 0 auto 16px;
    }

    .level-navigation button {
      min-width: 72px;
      padding: 8px 12px;
      border: 1px solid #454d53;
      border-radius: 4px;
      background: #29323a;
      color: #fff;
      font: inherit;
      font-size: 13px;
      cursor: pointer;
    }

    .level-navigation button:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    .level-number {
      min-width: 78px;
      color: #3f3f46;
      font-size: 13px;
      font-weight: 700;
      text-align: center;
    }

    .game-layout {
      position: relative;
      display: grid;
      grid-template-columns: max-content max-content max-content;
      grid-template-rows: repeat(var(--grid-size, 12), minmax(0, var(--cell-size)));
      align-items: stretch;
      column-gap: 8px;
      row-gap: 0;
      width: max-content;
      max-width: 100%;
      margin: 0 auto;
      padding: 0 0 16px;
    }

    .board-shell {
      grid-column: 2;
      grid-row: 1 / -1;
    }

    .marker {
      display: flex;
      align-items: center;
      align-self: center;
      gap: 5px;
      color: #333;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }

    .marker.start {
      grid-column: 1;
      grid-row: var(--start-row, 8);
      justify-content: flex-end;
    }

    .marker.target {
      grid-column: 3;
      grid-row: var(--target-row, 2);
      justify-content: flex-start;
    }

    .marker-label {
      padding: 5px 7px;
      border-radius: 4px;
      color: #fff;
      letter-spacing: .04em;
    }

    .start .marker-label { background: #16a34a; }
    .target .marker-label { background: #ea580c; }
    .marker-arrow { color: #ea580c; font-size: 18px; }

    .rocket-runner {
      position: absolute;
      z-index: 2;
      width: 28px;
      height: 28px;
      overflow: visible;
      pointer-events: none;
      filter: drop-shadow(0 2px 2px rgb(0 0 0 / 28%));
    }

    .board-shell {
      width: max-content;
      overflow: hidden;
      border: 1px solid #9ca3af;
      border-radius: 3px;
      background: #fff;
      box-shadow: 0 3px 12px rgb(0 0 0 / 9%);
    }

    .board {
      display: grid;
      grid-template-columns: repeat(var(--grid-size, 12), var(--cell-size));
      grid-template-rows: repeat(var(--grid-size, 12), var(--cell-size));
    }

    .cell {
      position: relative;
      display: grid;
      place-items: center;
      min-width: 0;
      min-height: 0;
      padding: 0;
      border: 1px solid var(--grid-line);
      border-radius: 0;
      background: #fff;
      color: #fff;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .cell.dark { background: var(--dark-cell); }
    .cell.dark:hover { background: #686868; }
    .cell.selected.dark { box-shadow: inset 0 0 0 2px var(--accent); }
    .cell.selected.dark:hover { background: #686868; }
    .cell.dark.path-revealed,
    .cell.selected.dark.path-revealed,
    .cell.dark.path-revealed:hover,
    .cell.selected.dark.path-revealed:hover {
      background: #2563eb !important;
      box-shadow: inset 0 0 0 3px #1d4ed8 !important;
    }
    .cell.block-right { border-right: 3px solid var(--block-line); }
    .cell.block-bottom { border-bottom: 3px solid var(--block-line); }
    .cell.start-cell { border-left: 2px solid #16a34a; }
    .cell.target-cell { border-right: 2px solid #ea580c; }

    .arrow {
      display: block;
      width: 62%;
      height: 62%;
      overflow: visible;
      pointer-events: none;
      color: #fff;
    }

    .controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      margin-top: 20px;
    }

    .timer {
      position: relative;
      display: grid;
      place-items: center;
      width: 54px;
      height: 54px;
      margin-right: 2px;
      color: #3f3f46;
      font-size: 13px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .timer svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
    }

    .timer circle {
      fill: none;
      stroke-width: 3.5;
    }

    .timer .track { stroke: #e4e4e7; }
    .timer .progress {
      stroke: #52525b;
      stroke-linecap: round;
      stroke-dasharray: 138.23;
      transition: stroke-dashoffset 1s linear;
    }

    .timer.warning { color: #dc2626; }
    .timer.warning .progress { stroke: #dc2626; }

    .control-button {
      display: grid;
      place-items: center;
      width: 58px;
      height: 56px;
      gap: 3px;
      border: 0;
      border-radius: 10px;
      background: #303030;
      color: #fff;
      cursor: pointer;
      box-shadow: 0 2px 5px rgb(0 0 0 / 15%);
      transition: background .15s ease, transform .15s ease;
    }

    .control-button:hover { background: #4b4b4b; transform: translateY(-1px); }
    .control-button:active { transform: translateY(0); }
    .control-button:focus-visible, .cell:focus-visible { outline: 3px solid #2563eb; outline-offset: 2px; }
    .control-button svg { width: 20px; height: 20px; }
    .control-button span { font-size: 9px; line-height: 1; }

    .status {
      min-height: 24px;
      margin: 14px 0 0;
      color: #52525b;
      font-size: 14px;
      text-align: center;
    }

    .moves-count {
      margin: 12px 0 0;
      color: #52525b;
      font-size: 13px;
      font-variant-numeric: tabular-nums;
      text-align: center;
    }

    .status.success { color: #15803d; font-weight: 700; }
    .status.error { color: #b91c1c; }
    .board.shake { animation: shake .35s ease-in-out; }

    .victory-overlay {
      display: grid;
      place-items: center;
      grid-column: 4;
      grid-row: 1 / -1;
      align-self: center;
      width: min(290px, 28vw);
      padding: 10px;
    }

    .victory-overlay[hidden] { display: none; }

    .victory-dialog {
      width: 100%;
      padding: 24px 18px;
      border: 1px solid #e4e4e7;
      border-radius: 18px;
      background: #fff;
      box-shadow: 0 8px 24px rgb(0 0 0 / 12%);
      text-align: center;
    }

    .victory-check {
      display: grid;
      place-items: center;
      width: 72px;
      height: 72px;
      margin: 0 auto 18px;
      border-radius: 50%;
      background: #dcfce7;
      color: #16a34a;
      font-size: 42px;
      font-weight: 700;
    }

    .victory-dialog h2 {
      margin: 0;
      color: #27272a;
      font-size: clamp(22px, 5vw, 28px);
      font-weight: 500;
    }

    .victory-dialog p {
      margin: 14px 0 24px;
      color: #71717a;
      font-size: 16px;
    }

    .victory-continue {
      min-width: 128px;
      padding: 12px 22px;
      border: 0;
      border-radius: 12px;
      background: #f97316;
      color: #fff;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }

    .victory-continue:hover { background: #ea580c; }
    .victory-continue:focus-visible { outline: 3px solid #2563eb; outline-offset: 3px; }

    @keyframes shake {
      20%, 60% { transform: translateX(-5px); }
      40%, 80% { transform: translateX(5px); }
    }

    @media (max-width: 620px) {
      :root { --cell-size: min(4vw, 24px); }
      .assessment-header { min-height: 156px; }
      .header-notice { min-height: 42px; font-size: 10px; }
      .brand-row { min-height: 114px; padding: 16px; }
      .site-navigation { gap: 6px; }
      .site-navigation a { padding: 7px 9px; font-size: 12px; }
      main { padding: 12px 8px 24px; }
      .question-bar { margin-bottom: 14px; }
      .game-layout { max-width: calc(100% - 40px); }
      .victory-overlay {
        grid-column: 1 / -1;
        grid-row: auto;
        justify-self: center;
        width: min(290px, calc(100vw - 24px));
        padding: 10px 0;
      }
      .marker { gap: 2px; }
      .marker-label { display: none; }
      .marker-arrow { font-size: 15px; }
      .controls { gap: 5px; }
      .control-button { width: 50px; height: 48px; gap: 2px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <header class="assessment-header">

      <nav class="site-navigation" aria-label="Game navigation">
        <a href="ACCENTURE%20PATH%20GAME.HTML" aria-current="page">Arrow Games</a>
        <a href="bubble.html">Bubble Game</a>
      </nav>
    </div>
  </header>
  <main>
    <h1 class="sr-only">Accenture Path Game — Question 1</h1>

      <button id="nextLevel" type="button">Next</button>

    <section class="game-layout" aria-label="Arrow path puzzle">
      <div class="marker start" aria-label="Start">
        <span class="marker-label">START</span>
        <span class="marker-arrow" aria-hidden="true">➜</span>
      </div>

        <div class="board" id="board" role="grid" aria-label="12 by 12 arrow puzzle"></div>
      </div>
      <div class="marker target" aria-label="Target">
        <span class="marker-arrow" aria-hidden="true">➜</span>
        <span class="marker-label">TARGET</span>
      </div>
      <svg class="rocket-runner" id="rocketRunner" viewBox="0 0 32 32" aria-hidden="true">
        <path d="M16 2c5.5 3.7 8.2 9.4 7.5 16.2L16 25l-7.5-6.8C7.8 11.4 10.5 5.7 16 2Z" fill="#6d28d9" stroke="#fff" stroke-width="1.5"/>

      </svg>
      <div class="victory-overlay" id="victoryOverlay" hidden>
        <section class="victory-dialog" role="dialog" aria-labelledby="victoryTitle" aria-describedby="victorySummary">
          <div class="victory-check" aria-hidden="true">✓</div>
          <h2 id="victoryTitle">Great! You found the path</h2>
          <p id="victorySummary">Solved in 0 moves.</p>
          <button class="victory-continue" id="continueButton" type="button">Continue</button>
        </section>
      </div>
    </section>

    <div class="controls" aria-label="Game controls">
      <div class="timer" id="timer" aria-label="Time remaining">
        <svg viewBox="0 0 56 56" aria-hidden="true">
          <circle class="track" cx="28" cy="28" r="22"></circle>
          <circle class="progress" id="timerProgress" cx="28" cy="28" r="22"></circle>
        </svg>
        <span id="timerText">3:59</span>
      </div>
      <button class="control-button" id="rotateButton" type="button" title="Rotate selected block (R)" aria-label="Rotate selected block">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 8a9 9 0 1 0 2.7-6.3L3 8"></path><path d="M3 3v5h5"></path>
        </svg>
        <span aria-hidden="true">Rotate ↶</span>
      </button>
      <button class="control-button" id="flipButton" type="button" title="Flip selected block (F)" aria-label="Flip selected block">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="m17 2 4 4-4 4"></path><path d="M3 11v-1a4 4 0 0 1 4-4h14"></path><path d="m7 22-4-4 4-4"></path><path d="M21 13v1a4 4 0 0 1-4 4H3"></path>
        </svg>
        <span aria-hidden="true">Flip</span>
      </button>
      <button class="control-button" id="submitButton" type="button" title="Submit path (Enter)" aria-label="Submit path">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M20 6 9 17l-5-5"></path>
        </svg>
        <span aria-hidden="true">Submit</span>
      </button>
      <button class="control-button" id="resetButton" type="button" title="Reset puzzle" aria-label="Reset puzzle">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path>
        </svg>
        <span aria-hidden="true">Reset</span>
      </button>
    </div>
    <p class="moves-count" id="movesCount" aria-live="polite">Moves: 0</p>
    <p class="status" id="status" role="status" aria-live="polite">Select any cell in a 3×3 block to highlight it.</p>
  </main>

            "12,10": "up",
            "13,0": "right", "13,1": "right", "13,2": "right", "13,3": "right",
            "13,4": "right", "13,5": "right", "13,6": "right", "13,7": "right",
            "13,8": "right", "13,10": "up",
            "13,12": "right", "13,13": "right", "13,14": "right", "13,15": "right",
            "13,16": "right", "13,17": "right",
            "14,10": "up",
            "15,1": "down",
            "16,1": "right", "16,2": "right", "16,3": "right", "16,4": "right", "16,5": "right",
            "16,6": "right", "16,7": "right", "16,8": "right", "16,9": "right",
            "16,10": "right", "16,11": "right", "16,12": "right", "16,13": "right",
            "16,14": "right", "16,15": "right", "16,16": "right", "16,17": "right"
          },
          blankDark: ["2,4", "0,13", "1,14", "6,13", "8,13", "10,9", "10,1", "12,13", "13,9", "13,11", "14,13", "14,16", "15,1", "15,10", "15,16", "16,0", "17,1", "17,16"]
        }
      };
      let currentLevel = 2;
      let START = LEVELS[currentLevel].start;
      let TARGET = LEVELS[currentLevel].target;
      const OPPOSITE_DIRECTIONS = {
        right: "left", left: "right", up: "down", down: "up",
        downright: "upleft", upleft: "downright", downleft: "upright", upright: "downleft"
      };
      const ROTATE_COUNTERCLOCKWISE = {
        right: "up", up: "left", left: "down", down: "right",
        downright: "upright", upright: "upleft", upleft: "downleft", downleft: "downright"
      };
      const DIRECTIONS = {
        right: [0, 1], left: [0, -1], up: [-1, 0], down: [1, 0]
      };
      const CORNERS = {
        downright: { right: "down", down: "right" },
        upright: { right: "up", up: "right" },
        downleft: { left: "down", down: "left" },
        upleft: { left: "up", up: "left" }
      };
      const ARROW_ANGLES = {
        right: 0, downright: 45, down: 90, downleft: 135,
        left: 180, upleft: 225, up: 270, upright: 315
      };
      const board = document.getElementById("board");
      const boardShell = document.getElementById("boardShell");
      const gameLayout = document.querySelector(".game-layout");
      const rocketRunner = document.getElementById("rocketRunner");
      const status = document.getElementById("status");
      const timer = document.getElementById("timer");
      const timerText = document.getElementById("timerText");
      const timerProgress = document.getElementById("timerProgress");
      const movesCount = document.getElementById("movesCount");
      const victoryOverlay = document.getElementById("victoryOverlay");
      const victorySummary = document.getElementById("victorySummary");
      let blocks = [];
      let selectedBlock = "2,0";
      let secondsLeft = TIME_LIMIT;
      let moves = 0;
      let timerId = null;
      let finished = false;
      let pathSolved = false;
      let rocketAnimation = null;
      let pathRevealTimerId = null;

      function currentPuzzle() {
        return LEVELS[currentLevel];
      }

      function countMove() {
        moves++;
        movesCount.textContent = `Moves: ${moves}`;
      }

      function makeInitialBlocks() {
        const result = [];
        const puzzle = currentPuzzle();
        const blocksPerSide = puzzle.gridSize / 3;
        for (let blockRow = 0; blockRow < blocksPerSide; blockRow++) {
          for (let blockCol = 0; blockCol < blocksPerSide; blockCol++) {
            const cells = [];
            for (let rowOffset = 0; rowOffset < 3; rowOffset++) {
              for (let colOffset = 0; colOffset < 3; colOffset++) {
                const row = blockRow * 3 + rowOffset;
                const col = blockCol * 3 + colOffset;
                const key = `${row},${col}`;
                const arrow = puzzle.arrows[key] || null;
                cells.push({
                  row,
                  col,
                  isDark: Boolean(arrow) || puzzle.blankDark.includes(key),
                  arrow
                });
              }
            }
            result.push({ blockRow, blockCol, cells });
          }
        }
        return result;
      }

      function showStatus(message, kind = "") {
        status.textContent = message;
        status.className = `status${kind ? ` ${kind}` : ""}`;
      }

      function createArrow(direction) {
        const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
        svg.setAttribute("viewBox", "0 0 24 24");
        svg.setAttribute("class", "arrow");
        svg.setAttribute("aria-hidden", "true");
        svg.style.transform = `rotate(${ARROW_ANGLES[direction] ?? 0}deg)`;
        const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
        path.setAttribute("d", "M5 12h11M13 7l5 5-5 5");
        path.setAttribute("fill", "none");
        path.setAttribute("stroke", "currentColor");
        path.setAttribute("stroke-width", "2.6");
        path.setAttribute("stroke-linecap", "round");
        path.setAttribute("stroke-linejoin", "round");
        svg.append(path);
        return svg;
      }

      function render() {
        const size = currentPuzzle().gridSize;
        board.style.setProperty("--grid-size", size);
        board.setAttribute("aria-label", `${size} by ${size} arrow puzzle`);
        gameLayout.style.setProperty("--grid-size", size);
        gameLayout.style.setProperty("--start-row", START.row + 1);
        gameLayout.style.setProperty("--target-row", TARGET.row + 1);
        const cellMap = new Map();
        for (const block of blocks) {
          for (const cell of block.cells) cellMap.set(`${cell.row},${cell.col}`, cell);
        }
        const fragment = document.createDocumentFragment();

        for (let row = 0; row < size; row++) {
          for (let col = 0; col < size; col++) {
            const key = `${row},${col}`;
            const cell = cellMap.get(key);
            const button = document.createElement("button");
            button.type = "button";
            button.className = "cell";
            button.dataset.row = String(row);
            button.dataset.col = String(col);
            button.setAttribute("role", "gridcell");
            button.setAttribute("aria-label", cell?.arrow ? `Row ${row + 1}, column ${col + 1}, ${cell.arrow} arrow` : `Row ${row + 1}, column ${col + 1}`);

            if (cell?.isDark) button.classList.add("dark");
            if (Math.floor(row / 3) === Number(selectedBlock.split(",")[0]) &&
                Math.floor(col / 3) === Number(selectedBlock.split(",")[1])) {
              button.classList.add("selected");
            }
            if ((col + 1) % 3 === 0 && col !== size - 1) button.classList.add("block-right");
            if ((row + 1) % 3 === 0 && row !== size - 1) button.classList.add("block-bottom");
            if (row === START.row && col === START.col) button.classList.add("start-cell");
            if (row === TARGET.row && col === TARGET.col) button.classList.add("target-cell");

            if (cell?.arrow) button.append(createArrow(cell.arrow));
            button.addEventListener("click", () => {
              if (finished) return;
              clearSolvedPathFeedback();
              selectedBlock = `${Math.floor(row / 3)},${Math.floor(col / 3)}`;
              showStatus(`Block ${Number(selectedBlock.split(",")[0]) + 1}×${Number(selectedBlock.split(",")[1]) + 1} selected.`);
              render();
            });
            fragment.append(button);
          }
        }
        board.replaceChildren(fragment);
      }

      function rotateSelectedBlock() {
        if (finished) return;
        const [blockRow, blockCol] = selectedBlock.split(",").map(Number);
        const block = blocks.find(item => item.blockRow === blockRow && item.blockCol === blockCol);
        if (!block) return;
        clearSolvedPathFeedback();
        delete block.directionCycle;
        const cellsToAnimate = block.cells.map(cell => {
          const localRow = cell.row - blockRow * 3;
          const localCol = cell.col - blockCol * 3;
          return {
            fromRow: cell.row,
            fromCol: cell.col,
            toRow: blockRow * 3 + 2 - localCol,
            toCol: blockCol * 3 + localRow
          };
        });
        const startingRects = cellsToAnimate.map(({ fromRow, fromCol }) => {
          const element = board.querySelector(`[data-row="${fromRow}"][data-col="${fromCol}"]`);
          return element?.getBoundingClientRect() ?? null;
        });
        block.cells = block.cells.map(cell => {
          const localRow = cell.row - blockRow * 3;
          const localCol = cell.col - blockCol * 3;
          return {
            ...cell,
            row: blockRow * 3 + 2 - localCol,
            col: blockCol * 3 + localRow,
            arrow: cell.arrow ? ROTATE_COUNTERCLOCKWISE[cell.arrow] : null
          };
        });
        const rotatedGrayCells = block.cells.filter(cell => cell.isDark);
        const rotatedArrows = block.cells.filter(cell => cell.arrow);
        if (rotatedGrayCells.length === 4 && rotatedArrows.length === 3) {
          const arrowColumn = rotatedArrows[0].col;
          const arrowRows = rotatedArrows.map(cell => cell.row).sort((a, b) => a - b);
          if (
            rotatedArrows.every(cell => cell.col === arrowColumn) &&
            arrowRows[2] - arrowRows[0] === 2
          ) {
            block.cells = block.cells.map(cell => ({
              ...cell,
              arrow: cell.arrow ? "down" : null
            }));
          }
        }
        countMove();
        showStatus("Selected block and its arrows rotated 90 degrees counter-clockwise.");
        render();
        if (!window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
          const elementsToAnimate = cellsToAnimate.map(({ toRow, toCol }, index) => {
            const element = board.querySelector(`[data-row="${toRow}"][data-col="${toCol}"]`);
            const from = startingRects[index];
            const to = element?.getBoundingClientRect();
            if (!element || !from || !to) return null;
            element.style.transition = "none";
            element.style.transform =
              `translate(${from.left - to.left}px, ${from.top - to.top}px) rotate(-90deg)`;
            return element;
          }).filter(Boolean);
          window.requestAnimationFrame(() => {
            for (const element of elementsToAnimate) {
              element.style.transition = "transform 360ms ease-in-out";
              element.style.transform = "";
            }
          });
        }
      }

      function flipSelectedBlock() {
        if (finished) return;
        const [blockRow, blockCol] = selectedBlock.split(",").map(Number);
        const block = blocks.find(item => item.blockRow === blockRow && item.blockCol === blockCol);
        if (!block) return;
        clearSolvedPathFeedback();
        const grayCellPositions = new Set(block.cells
          .filter(cell => cell.isDark)
          .map(cell => `${cell.row - blockRow * 3},${cell.col - blockCol * 3}`));
        const isFiveCellCross = grayCellPositions.size === 5 &&
          ["0,1", "1,0", "1,1", "1,2", "2,1"].every(position => grayCellPositions.has(position));
        if (grayCellPositions.size === 4 && !isFiveCellCross) {
          if (!block.directionCycle) {
            const originalArrows = block.cells
              .filter(cell => cell.arrow)
              .map(cell => ({
                row: cell.row,
                col: cell.col,
                direction: cell.arrow
              }));
            const arrowPositions = new Set(originalArrows.map(arrow => `${arrow.row},${arrow.col}`));
            const grayCells = block.cells.filter(cell => cell.isDark);
            const straightLines = new Map();
            for (const cell of grayCells) {
              const rowLine = grayCells.filter(other => other.row === cell.row);
              if (rowLine.length === 3) straightLines.set(`row-${cell.row}`, rowLine);
              const colLine = grayCells.filter(other => other.col === cell.col);
              if (colLine.length === 3) straightLines.set(`col-${cell.col}`, colLine);
            }
            const straightLine = [...straightLines.values()].sort((first, second) =>
              second.filter(cell => arrowPositions.has(`${cell.row},${cell.col}`)).length -
              first.filter(cell => arrowPositions.has(`${cell.row},${cell.col}`)).length
            )[0];
            const directionByVector = {
              "0,1": "right", "0,-1": "left", "-1,0": "up", "1,0": "down",
              "1,1": "downright", "-1,-1": "upleft",
              "1,-1": "downleft", "-1,1": "upright"
            };
            let mixedLayouts = null;
            const threeCellLine = [...straightLines.values()].find(line => line.length === 3);
            if (threeCellLine) {
              const remainingCell = grayCells.find(cell => !threeCellLine.includes(cell));
              const isHorizontal = threeCellLine.every(cell => cell.row === threeCellLine[0].row);
              const orderedLine = [...threeCellLine].sort((first, second) =>
                isHorizontal ? first.col - second.col : first.row - second.row
              );
              const centerCell = orderedLine[1];
              const u = isHorizontal ? { row: 0, col: 1 } : { row: 1, col: 0 };
              const v = {
                row: remainingCell.row - centerCell.row,
                col: remainingCell.col - centerCell.col
              };
              const formsT = Math.abs(v.row) + Math.abs(v.col) === 1 &&
                u.row * v.row + u.col * v.col === 0;
              if (formsT) {
                const makeLayout = entries => entries.map(([localRow, localCol, direction]) => {
                  const directionVectors = {
                    right: { row: 0, col: 1 },
                    downright: { row: 1, col: 1 },
                    down: { row: 1, col: 0 },
                    upright: { row: -1, col: 1 },
                    up: { row: -1, col: 0 }
                  };
                  const vector = directionVectors[direction];
                  const actualVector = {
                    row: vector.col * u.row + vector.row * v.row,
                    col: vector.col * u.col + vector.row * v.col
                  };
                  return {
                    row: centerCell.row + (localCol - 1) * u.row + (localRow - 1) * v.row,
                    col: centerCell.col + (localCol - 1) * u.col + (localRow - 1) * v.col,
                    direction: directionByVector[`${actualVector.row},${actualVector.col}`]
                  };
                });
                mixedLayouts = [
                  makeLayout([[1, 0, "right"], [1, 1, "downright"], [2, 1, "down"]]),
                  makeLayout([[1, 1, "upright"], [1, 2, "right"], [2, 1, "up"]])
                ];
              }
            }
            if (originalArrows.length === 0) {
              showStatus("Selected block has no arrows to change.", "error");
              return;
            }
            block.directionCycle = {
              originalArrows,
              straightArrowPositions: (straightLine || originalArrows).map(cell => ({
                row: cell.row,
                col: cell.col
              })),
              mixedLayouts,
              stage: 0
            };
          }

          const cycle = block.directionCycle;
          const arrowsByPosition = new Map();
          if (cycle.stage === 0) {
            for (const arrow of cycle.originalArrows) {
              arrowsByPosition.set(
                `${arrow.row},${arrow.col}`,
                OPPOSITE_DIRECTIONS[arrow.direction]
              );
            }
          } else if (cycle.stage === 1) {
            for (const position of cycle.straightArrowPositions) {
              arrowsByPosition.set(`${position.row},${position.col}`, "right");
            }
          } else if (cycle.stage === 2) {
            for (const position of cycle.straightArrowPositions) {
              arrowsByPosition.set(`${position.row},${position.col}`, "left");
            }
          } else if (cycle.mixedLayouts && cycle.stage === 3) {
            for (const arrow of cycle.mixedLayouts[0]) {
              arrowsByPosition.set(`${arrow.row},${arrow.col}`, arrow.direction);
            }
          } else if (cycle.mixedLayouts && cycle.stage === 4) {
            for (const arrow of cycle.mixedLayouts[1]) {
              arrowsByPosition.set(`${arrow.row},${arrow.col}`, arrow.direction);
            }
          } else {
            for (const arrow of cycle.originalArrows) {
              arrowsByPosition.set(`${arrow.row},${arrow.col}`, arrow.direction);
            }
          }
          block.cells = block.cells.map(cell => ({
            ...cell,
            arrow: arrowsByPosition.get(`${cell.row},${cell.col}`) || null
          }));
          cycle.stage = (cycle.stage + 1) % (cycle.mixedLayouts ? 6 : 4);
          countMove();
          showStatus("The four-gray-cell block moved to the next arrow direction.");
          render();
          return;
        }
        if (isFiveCellCross) {
          const layoutCycle = [
            { "0,1": "up", "1,0": "right", "1,1": "upright" },
            { "0,1": "down", "1,0": "left", "1,1": "downleft" },
            { "1,0": "right", "1,1": "right", "1,2": "right" },
            { "1,0": "left", "1,1": "left", "1,2": "left" }
          ];
          const matchesLayout = layout =>
            block.cells.filter(cell => cell.arrow).length === 3 &&
            Object.entries(layout).every(([position, direction]) => {
              const [row, col] = position.split(",").map(Number);
              const cell = block.cells.find(item =>
                item.row === blockRow * 3 + row && item.col === blockCol * 3 + col
              );
              return cell?.arrow === direction;
            });
          const currentLayoutIndex = layoutCycle.findIndex(matchesLayout);
          const nextLayout = layoutCycle[(currentLayoutIndex + 1) % layoutCycle.length];
          block.cells = block.cells.map(cell => ({
            ...cell,
            arrow: nextLayout[`${cell.row - blockRow * 3},${cell.col - blockCol * 3}`] || null
          }));
          countMove();
          showStatus("The five-gray-cell block moved to the next arrow layout.");
          render();
          return;
        }
        if (!block.cells.some(cell => cell.arrow)) {
          showStatus("Selected block has no arrows to change.", "error");
          return;
        }
        block.cells = block.cells.map(cell => ({
          ...cell,
          arrow: cell.arrow ? OPPOSITE_DIRECTIONS[cell.arrow] : null
        }));
        countMove();
        showStatus("Each arrow now points in the opposite direction.");
        render();
      }

      function tracePath() {
        const size = currentPuzzle().gridSize;
        const cellMap = new Map();
        for (const block of blocks) {
          for (const cell of block.cells) cellMap.set(`${cell.row},${cell.col}`, cell);
        }
        const visited = new Set();
        const path = [];
        let current = { ...START };
        let direction = "right";

        for (let steps = 0; steps < size * size + 4; steps++) {
          const key = `${current.row},${current.col}`;
          if (visited.has(key)) break;
          visited.add(key);
          path.push(current);
          if (current.row === TARGET.row && current.col === TARGET.col) return { valid: true, path };

          const cell = cellMap.get(key);
          if (!cell?.isDark) break;
          if (cell.arrow) {
            const nextDirection = DIRECTIONS[cell.arrow] ? cell.arrow : CORNERS[cell.arrow]?.[direction];
            if (!nextDirection) break;
            direction = nextDirection;
          }
          const [deltaRow, deltaCol] = DIRECTIONS[direction];
          const next = { row: current.row + deltaRow, col: current.col + deltaCol };
          if (next.row < 0 || next.row >= size || next.col < 0 || next.col >= size) {
            if (next.col === size && next.row === TARGET.row) return { valid: true, path: [...path, TARGET] };
            break;
          }
          current = next;
        }
        return { valid: false, path };
      }

      function submitPath() {
        if (finished) return;
        clearSolvedPathFeedback();
        countMove();
        const result = tracePath();
        if (!result.valid) {
          showStatus("Path not connected yet. Adjust a block and try again.", "error");
          boardShell.classList.remove("shake");
          void boardShell.offsetWidth;
          boardShell.classList.add("shake");
          window.setTimeout(() => boardShell.classList.remove("shake"), 400);
          return;
        }
        completePath(result.path);
      }

      function getCenter(element) {
        const bounds = element.getBoundingClientRect();
        const layoutBounds = gameLayout.getBoundingClientRect();
        return {
          x: bounds.left + bounds.width / 2 - layoutBounds.left,
          y: bounds.top + bounds.height / 2 - layoutBounds.top
        };
      }

      function placeRocket(point, angle = 90) {
        rocketRunner.style.left = `${point.x}px`;
        rocketRunner.style.top = `${point.y}px`;
        rocketRunner.style.transform = `translate(-50%, -50%) rotate(${angle}deg)`;
      }

      function resetRocket() {
        if (rocketAnimation) rocketAnimation.cancel();
        rocketAnimation = null;
        window.clearTimeout(pathRevealTimerId);
        pathRevealTimerId = null;
        board.querySelectorAll(".path-revealed").forEach(cell => cell.classList.remove("path-revealed"));
        const startArrow = gameLayout.querySelector(".marker.start .marker-arrow");
        placeRocket(getCenter(startArrow));
      }

      function clearSolvedPathFeedback() {
        if (!pathSolved) return;
        pathSolved = false;
        victoryOverlay.hidden = true;
        resetRocket();
      }

      function revealPathCells(path, interval) {
        const cells = path
          .map(({ row, col }) => board.querySelector(`[data-row="${row}"][data-col="${col}"]`))
          .filter(Boolean);
        let index = 0;
        const revealNextCell = () => {
          if (index >= cells.length) return;
          cells[index++].classList.add("path-revealed");
          if (index < cells.length) {
            pathRevealTimerId = window.setTimeout(revealNextCell, interval);
          }
        };
        revealNextCell();
      }

      function animateRocketAlongPath(path) {
        const pathCells = path.filter(({ row, col }) =>
          board.querySelector(`[data-row="${row}"][data-col="${col}"]`)
        );
        const points = [
          getCenter(gameLayout.querySelector(".marker.start .marker-arrow")),
          ...pathCells.map(({ row, col }) => {
            const cell = board.querySelector(`[data-row="${row}"][data-col="${col}"]`);
            return getCenter(cell);
          }),
          getCenter(gameLayout.querySelector(".marker.target .marker-arrow"))
        ];
        const stepDuration = 450;
        const keyframes = points.map((point, index) => {
          const next = points[index + 1] || point;
          const angle = index < points.length - 1
            ? Math.atan2(next.y - point.y, next.x - point.x) * 180 / Math.PI + 90
            : 90;
          return {
            left: `${point.x}px`,
            top: `${point.y}px`,
            transform: `translate(-50%, -50%) rotate(${angle}deg)`,
            offset: index / (points.length - 1)
          };
        });

        if (window.matchMedia("(prefers-reduced-motion: reduce)").matches ||
            typeof rocketRunner.animate !== "function") {
          const destination = points[points.length - 1];
          pathCells.forEach(({ row, col }) => {
            board.querySelector(`[data-row="${row}"][data-col="${col}"]`)?.classList.add("path-revealed");
          });
          placeRocket(destination);
          showVictoryDialog();
          return;
        }

        revealPathCells(pathCells, stepDuration);
        rocketAnimation = rocketRunner.animate(keyframes, {
          duration: Math.max(3000, (points.length - 1) * stepDuration),
          easing: "linear",
          fill: "forwards"
        });
        rocketAnimation.onfinish = showVictoryDialog;
      }

      function showVictoryDialog() {
        showStatus("Great job! START is connected to TARGET.", "success");
        victorySummary.textContent = `Solved in ${moves} ${moves === 1 ? "move" : "moves"}.`;
        victoryOverlay.hidden = false;
        document.getElementById("continueButton").focus();
      }

      function completePath(path) {
        pathSolved = true;
        status.className = "status";
        status.textContent = "";
        animateRocketAlongPath(path);
      }

      function updateTimer() {
        const minutes = Math.floor(secondsLeft / 60);
        const seconds = secondsLeft % 60;
        timerText.textContent = `${minutes}:${String(seconds).padStart(2, "0")}`;
        timerProgress.style.strokeDashoffset = String(138.23 * (1 - secondsLeft / TIME_LIMIT));
        timer.classList.toggle("warning", secondsLeft <= 30);
      }

      function startTimer() {
        window.clearInterval(timerId);
        updateTimer();
        timerId = window.setInterval(() => {
          if (secondsLeft > 0) {
            secondsLeft--;
            updateTimer();
          } else {
            window.clearInterval(timerId);
            finished = true;
            showStatus("Time is up. Press Reset to try again.", "error");
          }
        }, 1000);
      }

      function resetGame() {
        blocks = makeInitialBlocks();
        selectedBlock = currentLevel === 2 ? "2,0" : currentLevel === 3 ? "2,2" : "0,0";
        secondsLeft = TIME_LIMIT;
        moves = 0;
        movesCount.textContent = "Moves: 0";
        finished = false;
        pathSolved = false;
        victoryOverlay.hidden = true;
        showStatus("Select any cell in a 3×3 block to highlight it.");
        render();
        resetRocket();
        startTimer();
      }

      function setLevel(level) {
        if (!LEVELS[level]) return;
        currentLevel = level;
        START = currentPuzzle().start;
        TARGET = currentPuzzle().target;
        document.getElementById("levelNumber").textContent = `LEVEL ${currentLevel}`;
        document.getElementById("questionBar").textContent = `Question ${currentLevel - 1} of ${Object.keys(LEVELS).length}`;
        document.querySelector(".sr-only").textContent = `Accenture Path Game — Question ${currentLevel - 1}`;
        document.getElementById("previousLevel").disabled = currentLevel === 2;
        document.getElementById("nextLevel").disabled = currentLevel === Math.max(...Object.keys(LEVELS).map(Number));
        document.title = `Accenture Path Game — Level ${currentLevel}`;
        resetGame();
      }

      document.getElementById("rotateButton").addEventListener("click", rotateSelectedBlock);
      document.getElementById("flipButton").addEventListener("click", flipSelectedBlock);
      document.getElementById("submitButton").addEventListener("click", submitPath);
      document.getElementById("resetButton").addEventListener("click", resetGame);
      document.getElementById("continueButton").addEventListener("click", () => {
        const lastLevel = Math.max(...Object.keys(LEVELS).map(Number));
        setLevel(currentLevel < lastLevel ? currentLevel + 1 : 2);
      });
      document.getElementById("previousLevel").addEventListener("click", () => setLevel(currentLevel - 1));
      document.getElementById("nextLevel").addEventListener("click", () => setLevel(currentLevel + 1));
      document.addEventListener("keydown", event => {
        if (event.target instanceof HTMLElement && ["INPUT", "TEXTAREA", "BUTTON"].includes(event.target.tagName)) return;
        if (event.key.toLowerCase() === "r") rotateSelectedBlock();
        else if (event.key.toLowerCase() === "f") flipSelectedBlock();
        else if (event.key === "Enter") submitPath();
      });

      setLevel(2);
    })();
  </script>
</body>
</html>
