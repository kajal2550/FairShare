<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f4f5">
  <title>Accenture Path Game — Level 2</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Arial, Helvetica, sans-serif;
      color: #27272a;
      background: #f2f2ef;
      --cell-size: min(3.2vw, 32px);
      --dark-cell: #777;
      --grid-line: #cbd0d5;
      --block-line: #090909;
      --accent: #facc15;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      background: #f2f2ef;
    }

    .assessment-header {
      min-height: 204px;
      color: #fff;
      background: #080b0e;
    }

    .header-notice {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 52px;
      padding: 10px 16px;
      border-bottom: 1px solid rgb(255 255 255 / 5%);
      background: #11171c;
      color: #e5e7eb;
      font-size: 12px;
      text-align: center;
    }

    .brand-row {
      display: flex;
      align-items: center;
      width: min(100%, 1120px);
      min-height: 150px;
      margin: 0 auto;
      padding: 24px;
    }

    .brand {
      position: relative;
      display: inline-block;
      color: #f7f7f7;
      font-size: clamp(28px, 5vw, 38px);
      font-weight: 700;
      letter-spacing: -1.8px;
      line-height: 1;
    }

    .brand-mark {
      position: absolute;
      top: -17px;
      right: 26px;
      color: #a100ff;
      font-size: 30px;
      font-weight: 800;
      line-height: 1;
      transform: rotate(-18deg);
    }

    main {
      width: min(100%, 1080px);
      margin: 0 auto;
      padding: 18px 24px 32px;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .question-bar {
      width: min(100%, 880px);
      min-height: 34px;
      margin: 0 auto 18px;
      padding: 8px 14px;
      border-radius: 2px;
      background: #26313a;
      color: #f4f4f5;
      font-size: 12px;
      font-weight: 600;
    }

    .level-navigation {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin: 0 auto 16px;
    }

    .level-navigation button {
      min-width: 72px;
      padding: 8px 12px;
      border: 1px solid #454d53;
      border-radius: 4px;
      background: #29323a;
      color: #fff;
      font: inherit;
      font-size: 13px;
      cursor: pointer;
    }

    .level-navigation button:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    .level-number {
      min-width: 78px;
      color: #3f3f46;
      font-size: 13px;
      font-weight: 700;
      text-align: center;
    }

    .game-layout {
      display: grid;
      grid-template-columns: max-content max-content max-content;
      grid-template-rows: repeat(var(--grid-size, 12), minmax(0, var(--cell-size)));
      align-items: stretch;
      column-gap: 8px;
      row-gap: 0;
      width: max-content;
      max-width: 100%;
      margin: 0 auto;
      padding: 0 0 16px;
    }

    .board-shell {
      grid-column: 2;
      grid-row: 1 / -1;
    }

    .marker {
      display: flex;
      align-items: center;
      align-self: center;
      gap: 5px;
      color: #333;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }

    .marker.start {
      grid-column: 1;
      grid-row: var(--start-row, 8);
      justify-content: flex-end;
    }

    .marker.target {
      grid-column: 3;
      grid-row: var(--target-row, 2);
      justify-content: flex-start;
    }

    .marker-label {
      padding: 5px 7px;
      border-radius: 4px;
      color: #fff;
      letter-spacing: .04em;
    }

    .start .marker-label { background: #16a34a; }
    .target .marker-label { background: #ea580c; }
    .marker-arrow { color: #ea580c; font-size: 18px; }

    .board-shell {
      width: max-content;
      overflow: hidden;
      border: 1px solid #9ca3af;
      border-radius: 3px;
      background: #fff;
      box-shadow: 0 3px 12px rgb(0 0 0 / 9%);
    }

    .board {
      display: grid;
      grid-template-columns: repeat(var(--grid-size, 12), var(--cell-size));
      grid-template-rows: repeat(var(--grid-size, 12), var(--cell-size));
    }

    .cell {
      position: relative;
      display: grid;
      place-items: center;
      min-width: 0;
      min-height: 0;
      padding: 0;
      border: 1px solid var(--grid-line);
      border-radius: 0;
      background: #fff;
      color: #fff;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .cell.dark { background: var(--dark-cell); }
    .cell.dark:hover { background: #686868; }
    .cell.selected.dark { box-shadow: inset 0 0 0 2px var(--accent); }
    .cell.selected.dark:hover { background: #686868; }
    .cell.block-right { border-right: 3px solid var(--block-line); }
    .cell.block-bottom { border-bottom: 3px solid var(--block-line); }
    .cell.start-cell { border-left: 2px solid #16a34a; }
    .cell.target-cell { border-right: 2px solid #ea580c; }

    .arrow {
      display: block;
      width: 62%;
      height: 62%;
      overflow: visible;
      pointer-events: none;
      color: #fff;
    }

    .controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      margin-top: 20px;
    }

    .timer {
      position: relative;
      display: grid;
      place-items: center;
      width: 54px;
      height: 54px;
      margin-right: 2px;
      color: #3f3f46;
      font-size: 13px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .timer svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
    }

    .timer circle {
      fill: none;
      stroke-width: 3.5;
    }

    .timer .track { stroke: #e4e4e7; }
    .timer .progress {
      stroke: #52525b;
      stroke-linecap: round;
      stroke-dasharray: 138.23;
      transition: stroke-dashoffset 1s linear;
    }

    .timer.warning { color: #dc2626; }
    .timer.warning .progress { stroke: #dc2626; }

    .control-button {
      display: grid;
      place-items: center;
      width: 48px;
      height: 48px;
      border: 0;
      border-radius: 10px;
      background: #303030;
      color: #fff;
      cursor: pointer;
      box-shadow: 0 2px 5px rgb(0 0 0 / 15%);
      transition: background .15s ease, transform .15s ease;
    }

    .control-button:hover { background: #4b4b4b; transform: translateY(-1px); }
    .control-button:active { transform: translateY(0); }
    .control-button:focus-visible, .cell:focus-visible { outline: 3px solid #2563eb; outline-offset: 2px; }
    .control-button svg { width: 22px; height: 22px; }

    .status {
      min-height: 24px;
      margin: 14px 0 0;
      color: #52525b;
      font-size: 14px;
      text-align: center;
    }

    .status.success { color: #15803d; font-weight: 700; }
    .status.error { color: #b91c1c; }
    .board.shake { animation: shake .35s ease-in-out; }

    @keyframes shake {
      20%, 60% { transform: translateX(-5px); }
      40%, 80% { transform: translateX(5px); }
    }

    @media (max-width: 620px) {
      :root { --cell-size: min(4vw, 24px); }
      .assessment-header { min-height: 156px; }
      .header-notice { min-height: 42px; font-size: 10px; }
      .brand-row { min-height: 114px; padding: 20px; }
      main { padding: 12px 8px 24px; }
      .question-bar { margin-bottom: 14px; }
      .game-layout { max-width: calc(100% - 40px); }
      .marker { gap: 2px; }
      .marker-label { display: none; }
      .marker-arrow { font-size: 15px; }
      .controls { gap: 8px; }
      .control-button { width: 43px; height: 43px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <header class="assessment-header">

    <div class="brand-row">

  <main>

          <path d="m17 2 4 4-4 4"></path><path d="M3 11v-1a4 4 0 0 1 4-4h14"></path><path d="m7 22-4-4 4-4"></path><path d="M21 13v1a4 4 0 0 1-4 4H3"></path>
        </svg>
      </button>
      <button class="control-button" id="submitButton" type="button" title="Submit path (Enter)" aria-label="Submit path">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">

        </svg>

    </div>
    <p class="status" id="status" role="status" aria-live="polite">Select any cell in a 3×3 block to highlight it.</p>

      };

      };

      let blocks = [];
      let selectedBlock = "2,0";
      let secondsLeft = TIME_LIMIT;
      let timerId = null;
      let finished = false;

      function currentPuzzle() {
        return LEVELS[currentLevel];
      }

      function makeInitialBlocks() {
        const result = [];
        const puzzle = currentPuzzle();
        const blocksPerSide = puzzle.gridSize / 3;
        for (let blockRow = 0; blockRow < blocksPerSide; blockRow++) {
          for (let blockCol = 0; blockCol < blocksPerSide; blockCol++) {
            const cells = [];
            for (let rowOffset = 0; rowOffset < 3; rowOffset++) {
              for (let colOffset = 0; colOffset < 3; colOffset++) {
                const row = blockRow * 3 + rowOffset;
                const col = blockCol * 3 + colOffset;
                const key = `${row},${col}`;
                const arrow = puzzle.arrows[key] || null;
                cells.push({
                  row,
                  col,
                  isDark: Boolean(arrow) || puzzle.blankDark.includes(key),
                  arrow
                });
              }
            }
            result.push({ blockRow, blockCol, cells });
          }
        }
        return result;
      }

      function showStatus(message, kind = "") {
        status.textContent = message;
        status.className = `status${kind ? ` ${kind}` : ""}`;
      }

      function createArrow(direction) {
        const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
        svg.setAttribute("viewBox", "0 0 24 24");
        svg.setAttribute("class", "arrow");
        svg.setAttribute("aria-hidden", "true");
        svg.style.transform = `rotate(${ARROW_ANGLES[direction] ?? 0}deg)`;
        const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
        path.setAttribute("d", "M5 12h11M13 7l5 5-5 5");
        path.setAttribute("fill", "none");
        path.setAttribute("stroke", "currentColor");
        path.setAttribute("stroke-width", "2.6");
        path.setAttribute("stroke-linecap", "round");
        path.setAttribute("stroke-linejoin", "round");
        svg.append(path);
        return svg;
      }

      function render() {
        const size = currentPuzzle().gridSize;
        board.style.setProperty("--grid-size", size);
        board.setAttribute("aria-label", `${size} by ${size} arrow puzzle`);
        const gameLayout = document.querySelector(".game-layout");
        gameLayout.style.setProperty("--grid-size", size);
        gameLayout.style.setProperty("--start-row", START.row + 1);
        gameLayout.style.setProperty("--target-row", TARGET.row + 1);
        const cellMap = new Map();
        for (const block of blocks) {
          for (const cell of block.cells) cellMap.set(`${cell.row},${cell.col}`, cell);
        }
        const fragment = document.createDocumentFragment();

        for (let row = 0; row < size; row++) {
          for (let col = 0; col < size; col++) {
            const key = `${row},${col}`;
            const cell = cellMap.get(key);
            const button = document.createElement("button");
            button.type = "button";
            button.className = "cell";
            button.setAttribute("role", "gridcell");
            button.setAttribute("aria-label", cell?.arrow ? `Row ${row + 1}, column ${col + 1}, ${cell.arrow} arrow` : `Row ${row + 1}, column ${col + 1}`);

            if (cell?.isDark) button.classList.add("dark");
            if (Math.floor(row / 3) === Number(selectedBlock.split(",")[0]) &&
                Math.floor(col / 3) === Number(selectedBlock.split(",")[1])) {
              button.classList.add("selected");
            }
            if ((col + 1) % 3 === 0 && col !== size - 1) button.classList.add("block-right");
            if ((row + 1) % 3 === 0 && row !== size - 1) button.classList.add("block-bottom");
            if (row === START.row && col === START.col) button.classList.add("start-cell");
            if (row === TARGET.row && col === TARGET.col) button.classList.add("target-cell");

            if (cell?.arrow) button.append(createArrow(cell.arrow));
            button.addEventListener("click", () => {
              if (finished) return;
              selectedBlock = `${Math.floor(row / 3)},${Math.floor(col / 3)}`;
              showStatus(`Block ${Number(selectedBlock.split(",")[0]) + 1}×${Number(selectedBlock.split(",")[1]) + 1} selected.`);
              render();
            });
            fragment.append(button);
          }
        }
        board.replaceChildren(fragment);
      }

      function rotateSelectedBlock() {
        if (finished) return;
        const [blockRow, blockCol] = selectedBlock.split(",").map(Number);
        const block = blocks.find(item => item.blockRow === blockRow && item.blockCol === blockCol);
        if (!block) return;
        block.cells = block.cells.map(cell => {
          const localRow = cell.row - blockRow * 3;
          const localCol = cell.col - blockCol * 3;
          return {
            ...cell,
            row: blockRow * 3 + localCol,
            col: blockCol * 3 + 2 - localRow,
            arrow: cell.arrow ? ROTATE[cell.arrow] : null
          };
        });
        showStatus("Selected block rotated clockwise.");
        render();
      }

      function flipSelectedBlock() {
        if (finished) return;
        const [blockRow, blockCol] = selectedBlock.split(",").map(Number);
        const block = blocks.find(item => item.blockRow === blockRow && item.blockCol === blockCol);
        if (!block) return;
        block.cells = block.cells.map(cell => ({
          ...cell,
          arrow: cell.arrow ? FLIP[cell.arrow] : null
        }));
        showStatus("Selected block flipped.");
        render();
      }

      function tracePath() {
        const size = currentPuzzle().gridSize;
        const cellMap = new Map();
        for (const block of blocks) {
          for (const cell of block.cells) cellMap.set(`${cell.row},${cell.col}`, cell);
        }
        const visited = new Set();
        const path = [];
        let current = { ...START };
        let direction = "right";

        for (let steps = 0; steps < size * size + 4; steps++) {
          const key = `${current.row},${current.col}`;
          if (visited.has(key)) break;
          visited.add(key);
          path.push(current);
          if (current.row === TARGET.row && current.col === TARGET.col) return { valid: true, path };

          const cell = cellMap.get(key);
          if (!cell?.isDark || !cell.arrow) break;
          const nextDirection = DIRECTIONS[cell.arrow] ? cell.arrow : CORNERS[cell.arrow]?.[direction];
          if (!nextDirection) break;
          direction = nextDirection;
          const [deltaRow, deltaCol] = DIRECTIONS[direction];
          const next = { row: current.row + deltaRow, col: current.col + deltaCol };
          if (next.row < 0 || next.row >= size || next.col < 0 || next.col >= size) {
            if (next.col === size && next.row === TARGET.row) return { valid: true, path: [...path, TARGET] };
            break;
          }
          current = next;
        }
        return { valid: false, path };
      }

      function submitPath() {
        if (finished) return;
        const result = tracePath();
        if (!result.valid) {
          showStatus("Path not connected yet. Adjust a block and try again.", "error");
          boardShell.classList.remove("shake");
          void boardShell.offsetWidth;
          boardShell.classList.add("shake");
          window.setTimeout(() => boardShell.classList.remove("shake"), 400);
          return;
        }
        finished = true;
        window.clearInterval(timerId);
        showStatus("Great job! START is connected to TARGET.", "success");
      }

      function updateTimer() {
        const minutes = Math.floor(secondsLeft / 60);
        const seconds = secondsLeft % 60;
        timerText.textContent = `${minutes}:${String(seconds).padStart(2, "0")}`;
        timerProgress.style.strokeDashoffset = String(138.23 * (1 - secondsLeft / TIME_LIMIT));
        timer.classList.toggle("warning", secondsLeft <= 30);
      }

      function startTimer() {
        window.clearInterval(timerId);
        updateTimer();
        timerId = window.setInterval(() => {
          if (secondsLeft > 0) {
            secondsLeft--;
            updateTimer();
          } else {
            window.clearInterval(timerId);
            finished = true;
            showStatus("Time is up. Press Reset to try again.", "error");
          }
        }, 1000);
      }

      function resetGame() {
        blocks = makeInitialBlocks();
        selectedBlock = currentLevel === 2 ? "2,0" : "0,0";
        secondsLeft = TIME_LIMIT;
        finished = false;
        showStatus("Select any cell in a 3×3 block to highlight it.");
        render();
        startTimer();
      }

      function setLevel(level) {
        if (!LEVELS[level]) return;
        currentLevel = level;
        START = currentPuzzle().start;
        TARGET = currentPuzzle().target;
        document.getElementById("levelNumber").textContent = `LEVEL ${currentLevel}`;
        document.getElementById("questionBar").textContent = `Question ${currentLevel - 1} of ${Object.keys(LEVELS).length}`;
        document.querySelector(".sr-only").textContent = `Accenture Path Game — Question ${currentLevel - 1}`;
        document.getElementById("previousLevel").disabled = currentLevel === 2;
        document.getElementById("nextLevel").disabled = currentLevel === Math.max(...Object.keys(LEVELS).map(Number));
        document.title = `Accenture Path Game — Level ${currentLevel}`;
        resetGame();
      }

      document.getElementById("rotateButton").addEventListener("click", rotateSelectedBlock);
      document.getElementById("flipButton").addEventListener("click", flipSelectedBlock);
      document.getElementById("submitButton").addEventListener("click", submitPath);
      document.getElementById("resetButton").addEventListener("click", resetGame);
      document.getElementById("previousLevel").addEventListener("click", () => setLevel(currentLevel - 1));
      document.getElementById("nextLevel").addEventListener("click", () => setLevel(currentLevel + 1));
      document.addEventListener("keydown", event => {
        if (event.target instanceof HTMLElement && ["INPUT", "TEXTAREA", "BUTTON"].includes(event.target.tagName)) return;
        if (event.key.toLowerCase() === "r") rotateSelectedBlock();
        else if (event.key.toLowerCase() === "f") flipSelectedBlock();
        else if (event.key === "Enter") submitPath();
      });

      setLevel(2);
    })();
  </script>
</body>
</html>
